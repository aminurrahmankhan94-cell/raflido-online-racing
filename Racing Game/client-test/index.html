<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Raflido Online Racing - Network Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #111;
      color: #fff;
    }

    h1 {
      margin-bottom: 10px;
    }

    button {
      padding: 12px 20px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    #loginBtn {
      background: #4285f4;
      color: white;
    }

    #queueBtn {
      background: #28a745;
      color: white;
    }

    #logoutBtn {
      background: #dc3545;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      background: #222;
      border-radius: 8px;
    }

    #log {
      margin-top: 20px;
      padding: 15px;
      background: #000;
      border-radius: 8px;
      min-height: 250px;
      max-height: 450px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 13px;
    }

    .user-info {
      margin-top: 15px;
      padding: 15px;
      background: #1d1d1d;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>🏁 Raflido Online Racing</h1>
  <p>Google Login + Multiplayer Server Test</p>

  <button id="loginBtn">
    Login with Google
  </button>

  <button id="queueBtn" disabled>
    Join Race Queue
  </button>

  <button id="logoutBtn" disabled>
    Logout
  </button>

  <div id="status">
    Status: Not logged in
  </div>

  <div id="userInfo" class="user-info" style="display:none;">
    <strong>User:</strong>
    <div id="userName"></div>

    <strong>Email:</strong>
    <div id="userEmail"></div>

    <strong>UID:</strong>
    <div id="userUid"></div>
  </div>

  <div id="log"></div>


  <!-- Firebase SDK -->
  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";


    // =====================================================
    // FIREBASE CONFIG
    // =====================================================

    const firebaseConfig = {
      apiKey: "AIzaSyCOVGBKsUiJThbGAfztoQ8j1oFmlhr0cqU",
      authDomain: "raflido-online-racing.firebaseapp.com",
      projectId: "raflido-online-racing",
      storageBucket: "raflido-online-racing.firebasestorage.app",
      messagingSenderId: "268033927150",
      appId: "1:268033927150:web:76fb20fe015051c206d0ff",
      measurementId: "G-HGYLFMRWYK"
    };


    // =====================================================
    // INITIALIZE FIREBASE
    // =====================================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();


    // =====================================================
    // RENDER SERVER
    // =====================================================

    const SERVER_URL =
      "wss://raflido-online-racing.onrender.com";


    // =====================================================
    // HTML ELEMENTS
    // =====================================================

    const loginBtn = document.getElementById("loginBtn");
    const queueBtn = document.getElementById("queueBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const statusBox = document.getElementById("status");
    const logBox = document.getElementById("log");

    const userInfo = document.getElementById("userInfo");
    const userName = document.getElementById("userName");
    const userEmail = document.getElementById("userEmail");
    const userUid = document.getElementById("userUid");


    // =====================================================
    // VARIABLES
    // =====================================================

    let currentUser = null;
    let socket = null;


    // =====================================================
    // LOG FUNCTION
    // =====================================================

    function log(message) {

      const time = new Date().toLocaleTimeString();

      logBox.textContent +=
        `[${time}] ${message}\n`;

      logBox.scrollTop = logBox.scrollHeight;
    }


    // =====================================================
    // STATUS FUNCTION
    // =====================================================

    function setStatus(message) {

      statusBox.textContent =
        "Status: " + message;

      log(message);
    }


    // =====================================================
    // GOOGLE LOGIN
    // =====================================================

    loginBtn.addEventListener("click", async () => {

      try {

        setStatus("Opening Google Login...");

        const result =
          await signInWithPopup(auth, provider);

        currentUser = result.user;

        log(
          "Google login successful: " +
          currentUser.email
        );

      } catch (error) {

        console.error(error);

        setStatus(
          "Login failed: " + error.message
        );
      }

    });


    // =====================================================
    // AUTH STATE
    // =====================================================

    onAuthStateChanged(auth, async (user) => {

      if (user) {

        currentUser = user;

        userInfo.style.display = "block";

        userName.textContent =
          user.displayName || "No name";

        userEmail.textContent =
          user.email || "No email";

        userUid.textContent =
          user.uid;

        loginBtn.disabled = true;

        logoutBtn.disabled = false;

        queueBtn.disabled = false;

        setStatus(
          "Logged in as " + user.email
        );

        // Connect to multiplayer server
        await connectToServer();

      } else {

        currentUser = null;

        userInfo.style.display = "none";

        loginBtn.disabled = false;

        logoutBtn.disabled = true;

        queueBtn.disabled = true;

        setStatus("Not logged in");

      }

    });


    // =====================================================
    // CONNECT TO WEBSOCKET SERVER
    // =====================================================

    async function connectToServer() {

      if (!currentUser) {

        log("No Firebase user.");

        return;
      }


      // Close previous connection

      if (socket) {

        try {
          socket.close();
        } catch (e) {}

        socket = null;
      }


      try {

        setStatus(
          "Getting Firebase ID token..."
        );


        // Get Firebase authentication token

        const token =
          await currentUser.getIdToken(true);


        log(
          "Firebase ID token received."
        );


        setStatus(
          "Connecting to multiplayer server..."
        );


        // Create WebSocket connection

        socket =
          new WebSocket(SERVER_URL);


        // =================================================
        // SOCKET OPEN
        // =================================================

        socket.addEventListener("open", () => {

          log(
            "WebSocket connected."
          );


          setStatus(
            "Connected to multiplayer server"
          );


          // Authenticate with server

          socket.send(
            JSON.stringify({
              type: "auth",
              token: token
            })
          );


          log(
            "Authentication sent to server."
          );

        });


        // =================================================
        // SOCKET MESSAGE
        // =================================================

        socket.addEventListener(
          "message",
          (event) => {

            try {

              const message =
                JSON.parse(event.data);


              log(
                "SERVER → " +
                JSON.stringify(
                  message,
                  null,
                  2
                )
              );


              handleServerMessage(message);


            } catch (error) {

              log(
                "Invalid server message: " +
                event.data
              );

            }

          }
        );


        // =================================================
        // SOCKET ERROR
        // =================================================

        socket.addEventListener(
          "error",
          (error) => {

            console.error(error);

            setStatus(
              "WebSocket error"
            );

          }
        );


        // =================================================
        // SOCKET CLOSE
        // =================================================

        socket.addEventListener(
          "close",
          () => {

            log(
              "WebSocket connection closed."
            );

            setStatus(
              "Disconnected from server"
            );

          }
        );


      } catch (error) {

        console.error(error);

        setStatus(
          "Connection failed: " +
          error.message
        );

      }

    }


    // =====================================================
    // SERVER MESSAGE HANDLER
    // =====================================================

    function handleServerMessage(message) {

      switch (message.type) {


        // -----------------------------------------------
        // AUTHENTICATED
        // -----------------------------------------------

        case "authenticated":

          setStatus(
            "Server authentication successful"
          );

          break;


        // -----------------------------------------------
        // MATCH FOUND
        // -----------------------------------------------

        case "match_found":

          setStatus(
            "Match found! Players: " +
            (message.players?.length || 0)
          );

          break;


        // -----------------------------------------------
        // COUNTDOWN
        // -----------------------------------------------

        case "countdown":

          setStatus(
            "Race starts in " +
            message.seconds +
            " seconds"
          );

          break;


        // -----------------------------------------------
        // RACE START
        // -----------------------------------------------

        case "race_start":

          setStatus(
            "🏁 RACE STARTED!"
          );

          break;


        // -----------------------------------------------
        // PLAYER FINISHED
        // -----------------------------------------------

        case "player_finished":

          log(
            "Player finished: " +
            JSON.stringify(message)
          );

          break;


        // -----------------------------------------------
        // RACE FINISHED
        // -----------------------------------------------

        case "race_finished":

          setStatus(
            "Race finished!"
          );

          log(
            "Race result: " +
            JSON.stringify(
              message,
              null,
              2
            )
          );

          break;


        // -----------------------------------------------
        // ERROR
        // -----------------------------------------------

        case "error":

          setStatus(
            "Server error: " +
            (message.message || "Unknown error")
          );

          break;


        // -----------------------------------------------
        // DEFAULT
        // -----------------------------------------------

        default:

          log(
            "Unknown server message type: " +
            message.type
          );

      }

    }


    // =====================================================
    // JOIN RACE QUEUE
    // =====================================================

    queueBtn.addEventListener(
      "click",
      () => {

        if (!socket) {

          setStatus(
            "Not connected to server"
          );

          return;
        }


        if (
          socket.readyState !==
          WebSocket.OPEN
        ) {

          setStatus(
            "WebSocket is not connected"
          );

          return;
        }


        socket.send(
          JSON.stringify({
            type: "join_queue"
          })
        );


        setStatus(
          "Searching for players..."
        );

      }
    );


    // =====================================================
    // LOGOUT
    // =====================================================

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          if (socket) {

            socket.close();

            socket = null;
          }


          await signOut(auth);


          log(
            "Logged out."
          );


        } catch (error) {

          console.error(error);

          setStatus(
            "Logout failed: " +
            error.message
          );

        }

      }
    );

  </script>

</body>
</html>
