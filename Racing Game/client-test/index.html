<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Raflido Online Racing</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #111;
      color: white;
    }

    h1 {
      margin-bottom: 10px;
    }

    button {
      padding: 12px 18px;
      margin: 6px 4px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    #login {
      background: #4285f4;
      color: white;
    }

    #queue {
      background: #20a464;
      color: white;
    }

    #queue:disabled {
      background: #555;
      cursor: not-allowed;
    }

    #log {
      background: #050505;
      color: #00ff66;
      padding: 16px;
      min-height: 300px;
      overflow: auto;
      white-space: pre-wrap;
      border-radius: 8px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>🏁 Raflido Online Racing</h1>

  <p>
    Google Login এবং Multiplayer Server connection test
  </p>

  <button id="login">
    Login with Google
  </button>

  <button id="queue" disabled>
    Find Race
  </button>

  <pre id="log"></pre>


  <script type="module">

    // =========================================================
    // FIREBASE
    // =========================================================

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    // তোমার Firebase configuration
    const firebaseConfig = {

      apiKey:
        "AIzaSyCOVGBKsUiJThbGAfztoQ8j1oFmlhr0cqU",

      authDomain:
        "raflido-online-racing.firebaseapp.com",

      projectId:
        "raflido-online-racing",

      storageBucket:
        "raflido-online-racing.firebasestorage.app",

      messagingSenderId:
        "268033927150",

      appId:
        "1:268033927150:web:76fb20fe015051c206d0ff"

    };


    // Firebase initialize
    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();


    // =========================================================
    // RACING SERVER
    // =========================================================

    // এখন Render server তৈরি হয়নি।
    // তাই আপাতত এটা পরিবর্তন করবে না।

    const SERVER_URL =
      "wss://YOUR-RENDER-SERVICE.onrender.com";


    // =========================================================
    // UI
    // =========================================================

    const logBox =
      document.getElementById("log");

    const loginButton =
      document.getElementById("login");

    const queueButton =
      document.getElementById("queue");


    let socket = null;


    // =========================================================
    // LOG FUNCTION
    // =========================================================

    function log(message) {

      const time =
        new Date().toLocaleTimeString();

      logBox.textContent +=
        `[${time}] ${message}\n`;

      logBox.scrollTop =
        logBox.scrollHeight;
    }


    // =========================================================
    // GOOGLE LOGIN
    // =========================================================

    loginButton.onclick = async function () {

      try {

        log("Opening Google Login...");

        const result =
          await signInWithPopup(
            auth,
            provider
          );


        const user =
          result.user;


        log(
          "Google Login successful!"
        );

        log(
          "Player: " +
          (user.displayName || "Racer")
        );

        log(
          "Email: " +
          (user.email || "")
        );


        // Firebase ID Token
        const token =
          await user.getIdToken();


        log(
          "Firebase ID token received."
        );


        // =====================================================
        // CONNECT TO GAME SERVER
        // =====================================================

        log(
          "Connecting to racing server..."
        );


        socket =
          new WebSocket(SERVER_URL);


        // Server connection successful
        socket.onopen = function () {

          log(
            "WebSocket connected."
          );


          // Server-কে Firebase token পাঠানো
          socket.send(
            JSON.stringify({

              type: "auth",

              token: token

            })
          );

        };


        // Server থেকে message
        socket.onmessage = function (event) {

          log(
            "SERVER: " +
            event.data
          );


          try {

            const message =
              JSON.parse(event.data);


            // Authentication successful
            if (
              message.type ===
              "authenticated"
            ) {

              log(
                "Server authentication successful!"
              );


              queueButton.disabled =
                false;

            }


            // Match found
            if (
              message.type ===
              "match_found"
            ) {

              log(
                "🏁 Race match found!"
              );

            }


            // Countdown
            if (
              message.type ===
              "countdown"
            ) {

              log(
                "Countdown: " +
                message.value
              );

            }


            // Race start
            if (
              message.type ===
              "race_start"
            ) {

              log(
                "🚗 RACE START!"
              );

            }


            // Player finish
            if (
              message.type ===
              "player_finished"
            ) {

              log(
                "Player finished: " +
                message.position +
                " position"
              );

            }


            // Race finished
            if (
              message.type ===
              "race_finished"
            ) {

              log(
                "🏆 Race finished!"
              );

            }


            // Server error
            if (
              message.type ===
              "error"
            ) {

              log(
                "❌ Server error: " +
                message.message
              );

            }

          }

          catch (error) {

            log(
              "Could not read server message."
            );

          }

        };


        // WebSocket error
        socket.onerror = function () {

          log(
            "❌ WebSocket connection error."
          );

        };


        // Connection closed
        socket.onclose = function () {

          log(
            "WebSocket connection closed."
          );

          queueButton.disabled =
            true;

        };

      }

      catch (error) {

        console.error(error);

        log(
          "❌ Google Login Error: " +
          error.message
        );

      }

    };


    // =========================================================
    // FIND RACE
    // =========================================================

    queueButton.onclick =
      function () {

        if (
          !socket ||
          socket.readyState !==
          WebSocket.OPEN
        ) {

          log(
            "❌ Server is not connected."
          );

          return;

        }


        log(
          "Searching for racers..."
        );


        socket.send(
          JSON.stringify({

            type:
              "join_queue"

          })
        );

      };


    // =========================================================
    // PAGE START
    // =========================================================

    log(
      "Raflido Racing client loaded."
    );

    log(
      "Waiting for Google Login..."
    );

  </script>

</body>
</html>
